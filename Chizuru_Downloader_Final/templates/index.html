<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chizuru Downloader</title>
    <!-- Favicon sekarang mengarah ke logo.png -->
    <link rel="icon" type="image/png" href="/static/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; }
        .chat-bubble::after {
            content: '';
            position: absolute;
            top: 50%;
            left: -10px;
            border-width: 10px;
            border-style: solid;
            border-color: transparent white transparent transparent;
            transform: translateY(-50%);
        }
        @media (max-width: 768px) {
            .chat-bubble::after {
                top: -10px;
                left: 50%;
                border-color: transparent transparent white transparent;
                transform: translateX(-50%);
            }
        }
        /* Efek khusus untuk menghilangkan background putih gambar */
        .blend-multiply {
            mix-blend-mode: multiply;
        }
    </style>
</head>
<body class="bg-rose-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl shadow-xl w-full max-w-4xl flex flex-col md:flex-row overflow-hidden border border-rose-100">
        
        <!-- Sisi Karakter Chizuru (Dibuat Full / Cover dan Background Menyatu) -->
        <!-- Menghapus p-6 agar gambar tidak ada jarak (margin) ke tepi, dan memakai bg-rose-200 biar kontras manis -->
        <div class="md:w-5/12 bg-rose-200 flex flex-col items-center justify-end relative overflow-hidden min-h-[300px] md:min-h-full">
            <!-- mix-blend-multiply membuat warna putih di gambar Chizuru jadi transparan dan menyatu dengan warna bg-rose-200! -->
            <img src="/static/chizuru.png" alt="Chizuru" 
                 class="absolute inset-0 w-full h-full object-cover object-top blend-multiply opacity-95" 
                 onerror="this.src='https://via.placeholder.com/300x400.png?text=Gambar+Chizuru'">
        </div>

        <!-- Sisi Konten / Downloader -->
        <div class="md:w-7/12 p-8 flex flex-col justify-center bg-white z-10">
            
            <div class="mb-6 relative bg-rose-50 p-4 rounded-2xl shadow-sm border border-rose-100 chat-bubble">
                <p id="chizuruText" class="text-gray-700 font-semibold text-lg text-center md:text-left transition-all duration-300">
                    "Halo! Aku Chizuru. Sini aku bantu download video dari platform mana aja, tanpa watermark pastinya~"
                </p>
            </div>

            <!-- TAMPILAN LOGO DAN JUDUL (logo.png) -->
            <div class="flex flex-col md:flex-row items-center justify-center md:justify-start mb-6 gap-4">
                <img src="/static/logo.png" alt="Logo App" class="w-16 h-16 rounded-2xl shadow-md border-2 border-rose-200 object-cover" onerror="this.src='https://via.placeholder.com/64?text=Logo'">
                <h1 class="text-3xl font-extrabold text-rose-600 text-center md:text-left">Chizuru Downloader</h1>
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-semibold text-gray-600 mb-2">Link Videonya di sini ya:</label>
                <input type="text" id="videoUrl" placeholder="Tempel linknya di sini..." 
                       class="w-full p-4 border-2 border-rose-200 rounded-xl focus:outline-none focus:border-rose-400 focus:ring-4 focus:ring-rose-100 transition duration-300">
            </div>
            
            <button onclick="prosesDownload()" id="btnDownload"
                    class="w-full bg-rose-500 text-white font-bold py-4 rounded-xl hover:bg-rose-600 active:scale-95 transition-all shadow-md shadow-rose-200 text-lg">
                Tolong Carikan Videonya!
            </button>

            <!-- Area Hasil -->
            <div id="hasil" class="mt-8 hidden animate-fade-in">
                <div class="bg-green-50 rounded-xl p-4 border border-green-200 text-center">
                    <p class="text-xs text-green-600 font-bold uppercase mb-1">Berhasil Ditemukan</p>
                    <p id="judulVideo" class="font-semibold text-gray-800 mb-4 line-clamp-2"></p>
                    <a id="linkDownload" href="#" target="_blank" 
                       class="inline-block w-full bg-green-500 text-white font-bold py-3 px-4 rounded-lg hover:bg-green-600 transition shadow-sm">
                        ⬇️ Download Videonya
                    </a>
                </div>
            </div>
            
        </div>
    </div>

    <script>
        async function prosesDownload() {
            const urlInput = document.getElementById('videoUrl').value;
            const btn = document.getElementById('btnDownload');
            const chizuruText = document.getElementById('chizuruText');
            const hasilDiv = document.getElementById('hasil');
            
            if (!urlInput) {
                chizuruText.innerText = "Ehh, linknya masih kosong nih. Diisi dulu ya biar aku bisa kerja!";
                chizuruText.classList.add('text-red-500');
                setTimeout(() => chizuruText.classList.remove('text-red-500'), 2000);
                return;
            }

            chizuruText.innerText = "Oke! Tunggu sebentar ya, Chizuru lagi usahain ambil videonya buat kamu...";
            chizuruText.classList.remove('text-red-500');
            hasilDiv.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = `<span class="animate-pulse">Lagi diproses...</span>`;
            btn.classList.replace('bg-rose-500', 'bg-gray-400');

            try {
                const respons = await fetch('/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: urlInput })
                });
                
                const data = await respons.json();

                    if (respons.ok) {
                        chizuruText.innerText = "Yeay! Videonya udah ketemu dan siap disedot. Jangan lupa klik tombol download di bawah ya~";
                        document.getElementById('judulVideo').innerText = data.title;
                        document.getElementById('linkDownload').href = data.download_url;
                        hasilDiv.classList.remove('hidden');
                    } else {
                        chizuruText.innerText = "Waduh... " + data.error;
                        chizuruText.classList.add('text-red-500');
                    }
            } catch (error) {
                chizuruText.innerText = "Aduh, koneksinya terputus atau servernya lagi ngambek nih. Coba lagi yuk!";
                chizuruText.classList.add('text-red-500');
            } finally {
                btn.disabled = false;
                btn.innerText = "Cari Video Lainnya";
                btn.classList.replace('bg-gray-400', 'bg-rose-500');
            }
        }
    </script>
</body>
</html>
